[project]
name = "drive2notion"
version = "0.1.0"
description = "Google Drive M4A·MP3 녹음 → 로컬 Whisper 전사 → Claude(구독) 정리 → Notion 페이지"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.157",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.5.0",
    "mlx-whisper>=0.4",
    "notion-client>=2.2",
    "pydantic>=2.9",
    "tenacity>=9.0",
]

[project.scripts]
drive2notion = "drive2notion.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drive2notion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
