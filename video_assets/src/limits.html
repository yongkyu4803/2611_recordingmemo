<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>한계 카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #3ecf8e; --primary-deep: #24b47e;
    --canvas: #ffffff; --hairline: #dfdfdf;
    --ink: #171717; --ink-mute: #707070;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; background: var(--canvas); }
  body {
    font-family: "Inter", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    color: var(--ink); word-break: keep-all;
    display: flex; flex-direction: column; justify-content: center; padding: 0 160px; gap: 56px;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .eyebrow { font-size: 30px; color: var(--ink-mute); font-weight: 500; }
  h1 { font-size: 64px; font-weight: 500; letter-spacing: -0.03em; line-height: 1.15; margin-top: 12px; }
  ol { list-style: none; padding: 0; border-top: 1px solid var(--hairline); }
  li { display: grid; grid-template-columns: 80px 1fr; align-items: baseline;
       padding: 32px 0; border-bottom: 1px solid var(--hairline); }
  .num { font-size: 26px; color: var(--primary-deep); font-weight: 500; }
  .what { font-size: 44px; font-weight: 500; letter-spacing: -0.015em; }
  .why { font-size: 30px; color: var(--ink-mute); margin-top: 10px; line-height: 1.45; }

  body.v { padding: 0 72px; gap: 64px; }
  body.v .eyebrow { font-size: 36px; }
  body.v h1 { font-size: 76px; }
  body.v li { grid-template-columns: 64px 1fr; padding: 40px 0; }
  body.v .num { font-size: 28px; }
  body.v .what { font-size: 50px; }
  body.v .why { font-size: 34px; }
</style>
</head>
<body>
  <header>
    <p class="eyebrow">한계</p>
    <h1>아직 안 되는 것 3가지</h1>
  </header>
  <ol>
    <li><span class="num mono">01</span><div><p class="what">Mac이 켜져 있어야 합니다</p><p class="why">잠자기 중에 올린 녹음은 Mac을 깨우면 이어서 처리됩니다</p></div></li>
    <li><span class="num mono">02</span><div><p class="what">누가 말했는지 구분하지 않습니다</p><p class="why">전사 원문에는 시간 표시와 말한 내용만 남습니다</p></div></li>
    <li><span class="num mono">03</span><div><p class="what">혼자 쓰는 용도입니다</p><p class="why">정리는 내 Claude 구독 한도를 같이 씁니다</p></div></li>
  </ol>
<script>
  if (new URLSearchParams(location.search).get("ratio") === "v") document.body.classList.add("v");
</script>
</body>
</html>
